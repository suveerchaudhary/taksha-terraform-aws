name: App Group - Deploy

on:
  workflow_dispatch:
    inputs:
      app_group:
        description: 'Which module'
        required: true
        type: choice
        options:
          - vpc
          - iam-team-users
      action:
        description: 'apply or destroy (plan always runs first, unattended)'
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: app-group
    defaults:
      run:
        working-directory: app_group/${{ inputs.app_group }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - run: terraform init
      - run: terraform validate

      - if: inputs.action == 'apply'
        run: terraform plan -out=tfplan

      - if: inputs.action == 'destroy'
        run: terraform plan -destroy -out=tfplan

      - name: Post plan to job summary
        run: |
          echo "### Module: ${{ inputs.app_group }} — Action: ${{ inputs.action }}" >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: app-group-plan
          path: app_group/${{ inputs.app_group }}/tfplan
          retention-days: 5

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: app-group   # <-- approval happens here, AFTER the plan is visible
    defaults:
      run:
        working-directory: app_group/${{ inputs.app_group }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: app-group-plan
          path: app_group/${{ inputs.app_group }}

      - run: terraform apply -auto-approve tfplan